name: Azure Deployment - DLP 101 Env Build

on:
  workflow_dispatch:
    inputs:
      EnvNamePrefix:
        description: "User Name Prefix for the environments, this will also be used for terraform state file and resource group naming."
        required: true
        type: string
      EnvCount:
        description: "Number of environments to deploy (1-99), 0 destroys all environments. When using multiple runs to create environments the value is the sum of new and all previous runs. E.G., if previously 3 environments were created and 2 more are needed, enter 5."
        required: true
        default: "0"
        type: string
      EnvStart:
        description: "Starting index for environment numbering"
        required: false
        default: "20"
        type: string
      TerraformApply:
        description: "Terraform Apply, if false only the Terraform Plan will be executed (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - false
          - true
jobs:
  ENV_BUILD:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: ENV Build Values
        run: |
          echo "env_prefix: ${{ github.event.inputs.EnvNamePrefix }}"
          echo "env_count:  ${{ github.event.inputs.EnvCount }}"
          echo "env_start:  ${{ github.event.inputs.EnvStart }}"
          echo "location:   ${{ vars.ENV_LOCATION }}"
          echo "username:   ${{ github.event.inputs.EnvNamePrefix }}"
          echo "password:   ${{ vars.ENV_PASSWORD }}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Get and Delete Bastion Shareable Links
        if: (github.event.inputs.TerraformApply == 'true')
        shell: pwsh
        run: |
          $ResourceGroupName = "rg-xperts-dlp101-bastion"
          $BastionName = "bastion-dlp101"

          Write-Host "Fetching existing Bastion shareable links..."
          $links = Get-AzBastionShareableLink -ResourceGroupName $ResourceGroupName -Name $BastionName -ErrorAction SilentlyContinue

          if ($links) {
              Write-Host "Found shareable links. Removing them now..."

              foreach ($link in $links) {
                  $vmId = $link.VmId
                  Write-Host "Deleting shareable link for VM: $vmId"
                  Remove-AzBastionShareableLink -ResourceGroupName $ResourceGroupName -Name $BastionName -TargetVmId $vmId -AsJob -Force
              }
              Start-Sleep -Seconds 60
              Get-Job
          } else {
              Write-Host "No shareable links found."
          }

      - name: Terraform Init
        id: init
        working-directory: ./terraform-shared-bastion
        run: terraform init -no-color -backend-config="resource_group_name=${{ secrets.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" -backend-config="storage_account_name=${{ secrets.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" -backend-config="container_name=${{ secrets.BACKEND_AZURE_STORAGE_CONTAINER_NAME }}" -backend-config="key=${{ github.event.inputs.EnvNamePrefix }}.terraform.tfstate"

      - name: Terraform Validate
        id: validate
        working-directory: ./terraform-shared-bastion
        run: terraform validate -no-color

      - name: Terraform State
        if: (github.event.inputs.TerraformApply == 'true')
        id: state
        working-directory: ./terraform-shared-bastion
        run: terraform state list

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform-shared-bastion
        run: terraform plan -lock=false -no-color -out=tfplan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_username: ${{ github.event.inputs.EnvNamePrefix }}
          TF_VAR_env_count: ${{ github.event.inputs.EnvCount }}
          TF_VAR_env_start: ${{ github.event.inputs.EnvStart }}
          TF_VAR_location: ${{ vars.ENV_LOCATION }}
          TF_VAR_password: ${{ vars.ENV_PASSWORD }}
          TF_VAR_user_principal_domain: ${{ vars.ENV_USER_PRINCIPAL_DOMAIN }}
          TF_VAR_onedrive_license_group_object_id: ${{ secrets.AZURE_ONEDRIVE_LICENSE_GROUP_OBJECT_ID }}

      - name: Terraform Apply
        if: (github.event.inputs.TerraformApply == 'true')
        id: apply
        working-directory: ./terraform-shared-bastion
        run: terraform apply -replace 'azapi_resource_action.resource_action_create_link["bastion_host"]' -auto-approve -parallelism=20 -no-color
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_username: ${{ github.event.inputs.EnvNamePrefix }}
          TF_VAR_env_count: ${{ github.event.inputs.EnvCount }}
          TF_VAR_env_start: ${{ github.event.inputs.EnvStart }}
          TF_VAR_location: ${{ vars.ENV_LOCATION }}
          TF_VAR_password: ${{ vars.ENV_PASSWORD }}
          TF_VAR_user_principal_domain: ${{ vars.ENV_USER_PRINCIPAL_DOMAIN }}
          TF_VAR_onedrive_license_group_object_id: ${{ secrets.AZURE_ONEDRIVE_LICENSE_GROUP_OBJECT_ID }}

      - name: Terraform Output
        id: output
        working-directory: ./terraform-shared-bastion
        run: terraform output shareable_links
